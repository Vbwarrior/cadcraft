[package]
name = "cadcraft-engine"
description = "CADCraft engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-geom = { workspace = true }
cadcraft-color = { workspace = true }
cadcraft-doc = { workspace = true }
cadcraft-dxf = { workspace = true }
cadcraft-constraints = { workspace = true }
cadcraft-fonts = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-wood = { workspace = true }
craft-docpath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Local git history for WoodCraft project files: init/add/commit only, never push (MIT). No
# network transport needed, so default features (https, ssh) are off to avoid an OpenSSL/libssh2
# system dependency. Native-only (its C dependency, libgit2, cannot build for wasm32): the
# browser build is out of scope for WoodCraft (`plans/WoodCraft_Context.md` §6).
git2 = { version = "0.19", default-features = false }

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
cadcraft-io = { workspace = true }
